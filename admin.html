<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>マニュアルの分類（総務部）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --green: #007237; --green-soft: #e6f1ea; --red: #E2470E; --red-soft: #fdece4; --yellow: #F9BE00;
  --bg: #FFFBE8; --card: #FFFFFF; --text: #231815; --sub: #6E625C; --line: #e7dfcf;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --green: #4fbf7f; --green-soft: #18301f; --red: #ff7a45; --red-soft: #3a2218;
    --bg: #1a1714; --card: #24201c; --text: #f3ece4; --sub: #b3a89f; --line: #3b342d;
  }
}
:root[data-theme="dark"] {
  --green: #4fbf7f; --green-soft: #18301f; --red: #ff7a45; --red-soft: #3a2218;
  --bg: #1a1714; --card: #24201c; --text: #f3ece4; --sub: #b3a89f; --line: #3b342d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif; font-size: 17px; line-height: 1.7; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
header { background: var(--card); border-bottom: 4px solid var(--green); }
header .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; flex: 1; }
header a { color: var(--green); font-size: 15px; }
main { padding: 20px 0 48px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin: 0 0 16px; }
.panel h2 { font-size: 19px; margin: 0 0 8px; }
.sub { color: var(--sub); font-size: 15px; margin: 0 0 12px; }
label.field { display: block; font-weight: 700; margin: 0 0 6px; }
input[type=password] { width: 100%; max-width: 360px; min-height: 48px; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 8px 20px; font: inherit; font-weight: 700; border: 0; border-radius: 999px; background: var(--red); color: #fff; cursor: pointer; }
.btn.sec { background: var(--card); color: var(--text); border: 1px solid var(--line); font-weight: 400; }
.btn:disabled { opacity: .5; cursor: default; }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.msg { margin: 10px 0 0; padding: 10px 14px; border-radius: 10px; font-size: 15px; }
.msg.err { background: var(--red-soft); color: var(--text); border-left: 4px solid var(--red); }
.msg.ok { background: var(--green-soft); border-left: 4px solid var(--green); }
.summary { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
.pill { font-size: 14px; padding: 4px 12px; border-radius: 999px; background: var(--green-soft); font-weight: 700; }
.pill.warn { background: var(--red-soft); color: var(--red); }
.item { border-top: 1px solid var(--line); padding: 16px 0; }
.item:first-of-type { border-top: 0; }
.item h3 { font-size: 17px; margin: 0 0 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 13px; padding: 1px 10px; border-radius: 999px; background: var(--red); color: #fff; font-weight: 700; }
.badge.done { background: var(--green-soft); color: var(--green); }
.id { font-family: "Outfit", sans-serif; font-size: 13px; color: var(--sub); word-break: break-all; }
fieldset { border: 0; margin: 10px 0 0; padding: 0; min-width: 0; }
legend { font-size: 14px; font-weight: 700; color: var(--sub); padding: 0; margin-bottom: 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 15px; }
.opt input { width: 18px; height: 18px; accent-color: var(--green); margin: 0; }
.opt:has(input:checked) { border-color: var(--green); background: var(--green-soft); font-weight: 700; }
.saved { font-size: 13px; color: var(--sub); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 style="display:flex;align-items:center;gap:8px"><img src="assets/kt-logo.svg" alt="KTグループ" style="height:30px;width:auto">マニュアルの分類（総務部）</h1>
    <a href="index.html">← マニュアル一覧へ</a>
  </div>
</header>

<main class="wrap">
  <!-- ログイン -->
  <section id="login" class="panel" hidden>
    <h2>🔒 ログイン</h2>
    <p class="sub">総務部のパスワードを入れてください。</p>
    <form id="loginForm">
      <label class="field" for="pw">パスワード</label>
      <input type="password" id="pw" autocomplete="current-password" required>
      <div class="row-actions"><button class="btn" type="submit" id="loginBtn">🔑 ログイン</button></div>
      <p id="loginMsg" class="msg err" hidden></p>
    </form>
  </section>

  <!-- 分類の一覧 -->
  <section id="main" hidden>
    <div class="panel">
      <h2>🗂️ マニュアルごとの分類</h2>
      <p class="sub">事業部はいくつでも選べます。種類は1つ選びます。「保存」を押すと、トップページを開き直したときに反映されます。<br>分類が「未設定」のマニュアルは、トップページで「全て」を選んだときだけ表示されます。</p>
      <div class="summary" id="summary"></div>
      <div id="list"></div>
    </div>

    <div class="panel">
      <h2>🔑 パスワードの変更</h2>
      <label class="field" for="pwCur">今のパスワード</label>
      <input type="password" id="pwCur" autocomplete="current-password">
      <label class="field" for="pwNew" style="margin-top:10px">新しいパスワード（8文字以上）</label>
      <input type="password" id="pwNew" autocomplete="new-password">
      <div class="row-actions">
        <button class="btn" type="button" id="pwBtn">💾 パスワードを変更</button>
        <button class="btn sec" type="button" id="logoutBtn">🚪 ログアウト</button>
      </div>
    </div>
  </section>

  <p id="fatal" class="msg err" hidden></p>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="assets/config.js"></script>
<script>
(function () {
  var API = window.MANUAL_API_URL || "";
  var DEPTS = window.MANUAL_DEPTS || [], TYPES = window.MANUAL_TYPES || [];
  var TOKEN_KEY = "manual-admin-token";
  var token = null;
  try { token = sessionStorage.getItem(TOKEN_KEY); } catch (e) {}
  var manuals = [];   // トップページのカードから読み取った一覧 [{id, title}]
  var saved = {};     // スプレッドシートの分類 id -> {depts, type, updated}

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 2600); }
  function fatal(t) { var el = $("fatal"); el.textContent = t; el.hidden = false; }
  function setToken(t) { token = t; try { t ? sessionStorage.setItem(TOKEN_KEY, t) : sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }

  function call(action, payload) {
    return fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: action, payload: payload || {} }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r || !r.ok) { var e = new Error((r && r.message) || "うまく処理できませんでした。"); e.code = r && r.error; throw e; }
        return r;
      }, function () { throw new Error("つながりませんでした。インターネットの接続を確かめて、もう一度お試しください。"); });
  }

  function onAuthErr(e) {
    if (e.code === "auth") { setToken(null); showLogin(); }
    toast(e.message);
  }

  /* トップページのカードから、マニュアルの一覧を読み取る（新しく足したものも自動で出る） */
  function loadManuals() {
    return fetch("index.html", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, "text/html");
      manuals = [];
      doc.querySelectorAll(".cards a.card").forEach(function (a) {
        var m = /manuals\/([^/]+)\//.exec(a.getAttribute("href") || "");
        if (!m || a.classList.contains("soon")) return;
        var h = a.querySelector("h2");
        manuals.push({ id: m[1], title: (h ? h.textContent : m[1]).replace(/\s+/g, " ").trim() });
      });
    });
  }

  function isSet(s) { return s && s.depts.length > 0 && s.type; }

  function render() {
    var notSet = manuals.filter(function (m) { return !isSet(saved[m.id]); }).length;
    $("summary").innerHTML = '<span class="pill">マニュアル ' + manuals.length + '本</span>' +
      (notSet ? '<span class="pill warn">⚠️ 未設定 ' + notSet + '本</span>' : '<span class="pill">✅ すべて設定済み</span>');
    $("list").innerHTML = manuals.map(function (m, i) {
      var s = saved[m.id] || { depts: [], type: "" };
      var set = isSet(s);
      return '<div class="item" data-id="' + esc(m.id) + '">' +
        '<h3>' + esc(m.title) + (set ? ' <span class="badge done">設定済み</span>' : ' <span class="badge">未設定</span>') + '</h3>' +
        '<div class="id">' + esc(m.id) + (s.updated ? '　／　最後の保存 ' + esc(s.updated) : '') + '</div>' +
        '<fieldset><legend>事業部（いくつでも）</legend><div class="opts">' +
          DEPTS.map(function (d) { return '<label class="opt"><input type="checkbox" name="d' + i + '" value="' + esc(d) + '"' + (s.depts.indexOf(d) >= 0 ? " checked" : "") + '>' + esc(d) + '</label>'; }).join("") +
        '</div></fieldset>' +
        '<fieldset><legend>種類（1つ）</legend><div class="opts">' +
          TYPES.map(function (t) { return '<label class="opt"><input type="radio" name="t' + i + '" value="' + esc(t) + '"' + (s.type === t ? " checked" : "") + '>' + esc(t) + '</label>'; }).join("") +
        '</div></fieldset>' +
        '<div class="row-actions"><button class="btn" type="button" data-save="' + i + '">💾 保存</button></div>' +
      '</div>';
    }).join("") || '<p class="sub">マニュアルが見つかりませんでした。</p>';
  }

  function setSaved(items) { saved = {}; (items || []).forEach(function (it) { saved[it.id] = it; }); }

  function showLogin() { $("main").hidden = true; $("login").hidden = false; setTimeout(function () { $("pw").focus(); }, 0); }
  function showMain() {
    $("login").hidden = true;
    return Promise.all([loadManuals(), call("list")]).then(function (r) {
      setSaved(r[1].items); render(); $("main").hidden = false;
    }).catch(function (e) { fatal(e.message || "読み込めませんでした。"); });
  }

  $("loginForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var btn = $("loginBtn"), msg = $("loginMsg");
    btn.disabled = true; msg.hidden = true;
    call("login", { password: $("pw").value }).then(function (r) {
      setToken(r.token); $("pw").value = ""; showMain(); toast("ログインしました");
    }).catch(function (e) { msg.textContent = e.message; msg.hidden = false; })
      .then(function () { btn.disabled = false; });
  });

  $("list").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-save]");
    if (!b) return;
    var i = +b.dataset.save, m = manuals[i], item = b.closest(".item");
    var depts = Array.prototype.map.call(item.querySelectorAll('input[type=checkbox]:checked'), function (x) { return x.value; });
    var t = item.querySelector('input[type=radio]:checked');
    if (!depts.length || !t) { toast("事業部と種類を、どちらも選んでください"); return; }
    b.disabled = true;
    call("save", { token: token, id: m.id, title: m.title, depts: depts, type: t.value }).then(function (r) {
      setSaved(r.items); render(); toast("保存しました：" + m.title);
    }).catch(onAuthErr).then(function () { b.disabled = false; });
  });

  $("pwBtn").addEventListener("click", function () {
    var b = this;
    b.disabled = true;
    call("changePassword", { token: token, current: $("pwCur").value, next: $("pwNew").value }).then(function () {
      $("pwCur").value = ""; $("pwNew").value = ""; toast("パスワードを変更しました");
    }).catch(onAuthErr).then(function () { b.disabled = false; });
  });

  $("logoutBtn").addEventListener("click", function () { setToken(null); showLogin(); toast("ログアウトしました"); });

  if (!API) { fatal("まだ準備中です（保存先が設定されていません）。"); return; }
  if (token) call("checkToken", { token: token }).then(showMain, function () { setToken(null); showLogin(); });
  else showLogin();
})();
</script>
</body>
</html>
